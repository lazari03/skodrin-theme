name: Deploy Skodrin to FTP
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview changes without uploading
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: skodrin-ftp-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -r -n1 php -l
      - name: Prepare theme package
        run: |
          mkdir -p /tmp/skodrin-theme
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='skodrin-core/' --exclude='node_modules/' --exclude='.wp-env.json' --exclude='package.json' --exclude='package-lock.json' --exclude='README.md' --exclude='.gitignore' ./ /tmp/skodrin-theme/
          test -f /tmp/skodrin-theme/style.css
          test -f /tmp/skodrin-theme/screenshot.png
          test -f ./skodrin-core/skodrin-core.php
      - name: Confirm FTP destinations
        run: |
          echo "FTP account root is wp-content."
          echo "Theme: /themes/skodrin-theme/"
          echo "Plugin: /plugins/skodrin-core/"
      - name: Upload theme
        id: theme
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /themes/skodrin-theme/
          local-dir: /tmp/skodrin-theme/
          protocol: ftps
          port: 21
          security: strict
          timeout: 60000
          dry-run: ${{ inputs.dry_run }}
          state-name: .skodrin-theme-deploy-state.json
      - name: Wait before theme retry
        if: steps.theme.outcome == 'failure'
        run: sleep 15
      - name: Retry theme upload
        if: steps.theme.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /themes/skodrin-theme/
          local-dir: /tmp/skodrin-theme/
          protocol: ftps
          port: 21
          security: strict
          timeout: 60000
          dry-run: ${{ inputs.dry_run }}
          state-name: .skodrin-theme-deploy-state.json
      - name: Upload companion plugin
        id: plugin
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /plugins/skodrin-core/
          local-dir: ./skodrin-core/
          protocol: ftps
          port: 21
          security: strict
          timeout: 60000
          dry-run: ${{ inputs.dry_run }}
          state-name: .skodrin-core-deploy-state.json
      - name: Wait before plugin retry
        if: steps.plugin.outcome == 'failure'
        run: sleep 15
      - name: Retry plugin upload
        if: steps.plugin.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /plugins/skodrin-core/
          local-dir: ./skodrin-core/
          protocol: ftps
          port: 21
          security: strict
          timeout: 60000
          dry-run: ${{ inputs.dry_run }}
          state-name: .skodrin-core-deploy-state.json
