name: Deploy Skodrin to FTP
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview changes without uploading
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: skodrin-ftp-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -r -n1 php -l
      - name: Prepare theme package
        run: |
          mkdir -p /tmp/skodrin-theme
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='skodrin-core/' --exclude='node_modules/' --exclude='.wp-env.json' --exclude='package.json' --exclude='package-lock.json' --exclude='README.md' --exclude='.gitignore' ./ /tmp/skodrin-theme/
          test -f /tmp/skodrin-theme/style.css
          test -f /tmp/skodrin-theme/screenshot.png
          test -f ./skodrin-core/skodrin-core.php
      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp
      - name: Verify WordPress site and deploy both packages
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FTP_SERVER" =~ ^[a-zA-Z0-9.-]+$ ]] || { echo "FTP_SERVER must be a hostname"; exit 1; }
          test -n "$FTP_USERNAME" && test -n "$LFTP_PASSWORD"
          ftp() {
            lftp --env-password -u "$FTP_USERNAME" -p 21 "ftp://$FTP_SERVER" <<EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set ftp:sync-mode true
          set net:timeout 25
          set net:max-retries 2
          set net:reconnect-interval-base 5
          $1
          bye
          EOF
          }
          root=""
          # Hosting's directory tree includes the account name, which may
          # already be the FTP login root. Probe both representations.
          for candidate in "/w01d6d1b/skodrinon.yea.al" "/skodrinon.yea.al"; do
            echo "Checking WordPress location: $candidate"
            if ftp "cd \"$candidate/wp-admin\"
          cd \"$candidate/wp-includes\"
          cd \"$candidate/wp-content/themes\"
          cd \"$candidate/wp-content/plugins\"" >/dev/null; then
              root="$candidate"
              break
            fi
          done
          if [[ -z "$root" ]]; then
            echo "Neither site-specific path contains the required WordPress directories."
            echo "Check the FTP account home directory and permissions. No files have been uploaded."
            exit 1
          fi
          theme="$root/wp-content/themes/skodrin-theme"
          plugin="$root/wp-content/plugins/skodrin-core"
          echo "Verified WordPress root: $root"
          echo "Theme destination: $theme"
          echo "Plugin destination: $plugin"
          flags="--reverse --verbose --parallel=1 --no-perms --ignore-time"
          if [[ "$DRY_RUN" == "true" ]]; then flags="$flags --dry-run"; fi
          for attempt in 1 2 3; do
            if ftp "mirror $flags /tmp/skodrin-theme \"$theme\"
          mirror $flags ./skodrin-core \"$plugin\""; then
              if [[ "$DRY_RUN" == "true" ]]; then
                echo "Dry run complete. No files uploaded."
              else
                ftp "cls -l \"$theme/screenshot.png\"
          cls -l \"$theme/style.css\"
          cls -l \"$plugin/skodrin-core.php\""
                echo "Deployment complete; key remote files verified."
              fi
              exit 0
            fi
            echo "FTPS attempt $attempt failed."
            if [[ "$attempt" != "3" ]]; then sleep 10; fi
          done
          exit 1
