<script>(function(){function init(){document.querySelectorAll('.rc-suggested').forEach(function(section){if(section.dataset.carouselReady)return;var list=section.querySelector('.wp-block-post-template');if(!list)return;section.dataset.carouselReady='1';var match=document.body.className.match(/\bpostid-(\d+)\b/);var cards=Array.from(list.children).filter(function(c){return !match||!c.classList.contains('post-'+match[1]);});if(match)Array.from(list.children).filter(function(c){return c.classList.contains('post-'+match[1]);}).forEach(function(c){c.remove();});for(var i=cards.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=cards[i];cards[i]=cards[j];cards[j]=t;}cards.forEach(function(c){list.appendChild(c);});if(!cards.length){section.hidden=true;return;}var pos=0;var controls=document.createElement('div');controls.className='rc-suggested-controls';var prev=document.createElement('button'),next=document.createElement('button'),status=document.createElement('span');prev.type=next.type='button';prev.textContent='‹';next.textContent='›';prev.setAttribute('aria-label','Artikujt e mëparshëm');next.setAttribute('aria-label','Artikujt e ardhshëm');status.setAttribute('aria-live','polite');status.className='rc-suggested-status';controls.append(prev,status,next);list.after(controls);function count(){return window.matchMedia('(max-width:540px)').matches?1:window.matchMedia('(max-width:900px)').matches?2:3;}function render(){var n=Math.min(count(),cards.length),max=Math.max(0,cards.length-n);pos=Math.min(pos,max);cards.forEach(function(c,i){c.hidden=i<pos||i>=pos+n;});prev.disabled=pos===0;next.disabled=pos>=max;controls.hidden=cards.length<=n;status.textContent=(pos+1)+'–'+Math.min(pos+n,cards.length)+' / '+cards.length;}prev.addEventListener('click',function(){pos=Math.max(0,pos-count());render();});next.addEventListener('click',function(){pos=Math.min(Math.max(0,cards.length-count()),pos+count());render();});window.addEventListener('resize',render);render();});}if
